Summary: Laya 决策助手 — 端侧 LiteRT 分层决策(LiteRT layered decision assistant)
Description: |-
  智能决策业务台:LiteRT 端侧推理(MTK NPU/GPU/CPU 引擎链),内置客服工单分流、UGC 审核、Agent 路由、金融风控、多语言分流五业务,支持动态注册新业务模型包;邮件/MQTT 网关接入决策指令;决策日志与日报/月报/年报/详单/下钻报表;界面中英双语。

  Intelligent decision console: on-device LiteRT inference (NPU→GPU→CPU engine chain) with 5 builtin businesses, dynamic model packs, email/MQTT gateways, decision logs and reports. UI in Chinese and English.

  说明:决策模型包(约 650MB/业务)需在系统页安装到 /sdcard/models 后启用;NPU 需 MTK 天玑 9500 等机型。
